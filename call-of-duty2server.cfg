// AMP partly controls server.cfg

// The first section below includes the settings that are set either via the AMP UI
// or are controlled by AMP itself (in particular, ports)
// Settings in the second section can be changed or added to as needed

// *******
// AMP CONTROLLED SETTINGS
// *******

set net_port "28960"
set net_ip ""
set dedicated "2"
sets sv_hostname "^1AMP Hosted COD2 Server"
set scr_motd "^4Welcome to COD2!"
set g_password ""
set rcon_password ""
set sv_mapRotation "gametype dm map mp_breakout gametype tdm map mp_brecourt gametype sd map mp_burgundy gametype ctf map mp_carentan gametype hq map mp_dawnville gametype dm map mp_decoy gametype tdm map mp_downtown gametype sd map mp_farmhouse gametype ctf map mp_harbor gametype hq map mp_leningrad gametype dm map mp_matmata gametype tdm map mp_railyard gametype sd map mp_rhine gametype ctf map mp_toujane gametype hq map mp_trainstation"
set g_gametype "dm"
set sv_maxclients "20"
set sv_privateclients "0"
set sv_privatePassword ""
set sv_voice "1"
set sv_voiceQuality "3"
set voice_deadChat "0"
set sv_minPing "0"
set sv_maxping "0"
set sv_maxRate "25000"
set sv_timeout "40"
set g_inactivity "120"
set g_inactivityspectator "180"
set sv_kickBanTime "300"
set sv_zombietime "2"
set sv_floodProtect "1"
set sv_reconnectlimit "5"
set logfile "1"
set g_logsync "2"
set g_log "games_mp.log"
set sv_punkbuster "0"


// *******
// OTHER SETTINGS
// *******

// General (shown in server browser info)
sets _Admin "admin"
sets _Email ""
sets _Website ""
sets _Location ""
sets _Irc ""

// Master servers
set sv_master1 "cod2master.activision.com"
set sv_master2 "cod2update.activision.com"
set sv_gamespy "0"

// Client download settings. Used for mods and custom maps. 0=off, 1=on
set sv_allowdownload "1"
seta sv_wwwDownload "0"
//seta sv_wwwBaseURL "http://www.your_website.com/base_folder"
seta sv_wwwDlDisconnected "0"

// FPS
//set sv_fps "20"

// Anti cheat / misc
set sv_cheats "0"
set sv_pure "1"
set sv_allowAnonymous "0"
set g_antilag "1"
set scr_allow_vote "0"
set scr_teambalance "1"
set scr_friendlyfire "0"
set scr_killcam "1"
set scr_spectatefree "0"
set scr_spectateenemy "0"
set scr_forcerespawn "0"
set scr_drawfriend "1"

// Deathmatch settings
set scr_dm_scorelimit 50
set scr_dm_timelimit 30

// Team Deathmatch settings
set scr_tdm_scorelimit 100
set scr_tdm_timelimit 30

// Search And Destroy settings
set scr_sd_scorelimit 10
set scr_sd_timelimit 0
set scr_sd_roundlimit 0
set scr_sd_roundlength 4
set scr_sd_graceperiod 15
set scr_sd_bombtimer 60

// Capture The Flag settings
set scr_ctf_scorelimit 5
set scr_ctf_timelimit 30

// Headquarters settings
set scr_hq_scorelimit 450
set scr_hq_timelimit 30
